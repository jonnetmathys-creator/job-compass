name: Collecte quotidienne

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 06:00 UTC
  workflow_dispatch: {}

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install -r scraper/requirements.txt
      - name: Lancer le scraper
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scraper.run
      # Après le scraping : l'app relie les offres, calcule les scores, envoie les alertes et purge.
      # Tourne même si le scraper a échoué (les sources API et le scoring restent utiles).
      - name: Rafraîchir l'application
        if: always()
        env:
          APP_URL: ${{ vars.APP_URL }}
          COLLECT_SECRET: ${{ secrets.COLLECT_SECRET }}
        run: |
          BASE="${APP_URL:-https://job-compass-pldk.onrender.com}"
          # Réveil du service (free tier en veille) : le démarrage à froid ne doit pas
          # manger le budget du refresh. On ignore le résultat de ce ping.
          echo "Réveil du service…"
          curl -s -o /dev/null --max-time 120 "$BASE/login" || true
          # Refresh : collecte API + scoring Gemini + alertes + purge + relances, en synchrone.
          # Le scoring de l'arriéré peut durer plusieurs minutes (mesuré ~510s), d'où 900s.
          echo "Rafraîchissement…"
          curl -fsS --max-time 900 "$BASE/api/refresh" -H "Authorization: Bearer $COLLECT_SECRET"
